<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Pile StorCube découverte automatiquement dans Home Assistant</title>
  <desc id="desc">Saisir le maître une seule fois. Baterway informe l’intégration de l’esclave. Home Assistant crée un appareil pour chaque module et une batterie virtuelle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="ha" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="390" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="20" r="150" fill="#38bdf8" opacity=".06"/><circle cx="70" cy="350" r="170" fill="#34d399" opacity=".05"/>
  <text x="58" y="62" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">STORCUBE • HOME ASSISTANT</text>
  <text x="58" y="104" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Une seule saisie : l’identifiant du maître</text>
  <text x="58" y="134" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">La pile remonte ses modules ; l’intégration ajoute l’esclave automatiquement.</text>
  <g filter="url(#shadow)">
    <rect x="55" y="176" width="250" height="150" rx="20" fill="#1e293b" stroke="#334155"/>
    <rect x="85" y="205" width="74" height="82" rx="11" fill="url(#bat)"/><rect x="107" y="197" width="30" height="9" rx="4" fill="#6ee7b7"/>
    <path d="M124 220 108 250h15l-6 22 22-32h-16z" fill="#ecfdf5"/>
    <text x="177" y="225" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="700">MAÎTRE</text>
    <text x="177" y="251" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Identifiant saisi</text>
    <text x="177" y="276" fill="#34d399" font-family="Arial,sans-serif" font-size="14" font-weight="700">1 seul module demandé</text>
    <rect x="55" y="176" width="250" height="150" rx="20" fill="none" stroke="#34d399" stroke-width="2"/>
  </g>
  <path d="M320 250h88" stroke="#93c5fd" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <text x="325" y="227" fill="#93c5fd" font-family="Arial,sans-serif" font-size="13" font-weight="700">DÉCOUVERTE</text>
  <g filter="url(#shadow)">
    <rect x="430" y="176" width="265" height="150" rx="20" fill="#1e293b" stroke="#334155"/>
    <circle cx="490" cy="251" r="37" fill="#0f3b57"/><path d="M490 227v23l16 10" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <text x="545" y="224" fill="#f8fafc" font-family="Arial,sans-serif" font-size="18" font-weight="700">CLOUD BATERWAY</text>
    <text x="545" y="251" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Liste la composition</text>
    <text x="545" y="276" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="14">Maître + esclave</text>
  </g>
  <path d="M710 250h82" stroke="#93c5fd" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="815" y="176" width="330" height="150" rx="20" fill="#1e293b" stroke="#334155"/>
    <rect x="842" y="207" width="92" height="43" rx="10" fill="#064e3b" stroke="#34d399"/><text x="888" y="234" text-anchor="middle" fill="#d1fae5" font-family="Arial,sans-serif" font-size="14" font-weight="700">MAÎTRE</text>
    <rect x="842" y="262" width="92" height="43" rx="10" fill="#064e3b" stroke="#34d399"/><text x="888" y="289" text-anchor="middle" fill="#d1fae5" font-family="Arial,sans-serif" font-size="14" font-weight="700">ESCLAVE</text>
    <path d="M934 228h25v55h-25" fill="none" stroke="#34d399" stroke-width="2"/>
    <rect x="978" y="220" width="137" height="74" rx="14" fill="url(#ha)"/>
    <path d="M1004 251h18l10-17 13 33 10-16h35" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1047" y="315" text-anchor="middle" fill="#93c5fd" font-family="Arial,sans-serif" font-size="13" font-weight="700">BATTERIE VIRTUELLE</text>
  </g>
  <text x="60" y="365" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Si Baterway ne retourne pas l’esclave, ajoute son identifiant dans « Configurer » en dépannage.</text>
</svg>
