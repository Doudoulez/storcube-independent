<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Mesures réunies par la batterie virtuelle StorCube</title>
  <desc id="desc">Les batteries maître et esclave alimentent un appareil virtuel Home Assistant qui regroupe charge, énergie et puissance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/></marker>
  </defs>
  <rect width="1000" height="330" rx="26" fill="url(#bg)"/>
  <text x="42" y="51" fill="#0f172a" font-family="Arial,sans-serif" font-size="23" font-weight="700">Une pile, une vue globale dans Home Assistant</text>
  <text x="42" y="78" fill="#475569" font-family="Arial,sans-serif" font-size="15">Chaque module garde ses propres capteurs ; la batterie virtuelle rassemble les totaux.</text>
  <g filter="url(#shadow)">
    <rect x="46" y="112" width="220" height="76" rx="16" fill="white" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="68" y="132" width="40" height="35" rx="7" fill="url(#green)"/><rect x="80" y="126" width="16" height="6" rx="3" fill="#34d399"/>
    <text x="125" y="145" fill="#0f172a" font-family="Arial,sans-serif" font-size="17" font-weight="700">Batterie maître</text><text x="125" y="169" fill="#64748b" font-family="Arial,sans-serif" font-size="13">Capteurs individuels</text>
    <rect x="46" y="209" width="220" height="76" rx="16" fill="white" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="68" y="229" width="40" height="35" rx="7" fill="url(#green)"/><rect x="80" y="223" width="16" height="6" rx="3" fill="#34d399"/>
    <text x="125" y="242" fill="#0f172a" font-family="Arial,sans-serif" font-size="17" font-weight="700">Batterie esclave</text><text x="125" y="266" fill="#64748b" font-family="Arial,sans-serif" font-size="13">Ajoutée automatiquement</text>
  </g>
  <path d="M282 150h101v44h50M282 247h101v-44h50" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <g filter="url(#shadow)">
    <rect x="450" y="110" width="500" height="177" rx="20" fill="#0f172a"/>
    <rect x="475" y="132" width="54" height="54" rx="15" fill="url(#blue)"/><path d="M488 157h10l6-11 7 23 6-12h6" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="550" y="154" fill="white" font-family="Arial,sans-serif" font-size="21" font-weight="700">Batterie virtuelle StorCube</text><text x="550" y="178" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14">Agrégation des modules détectés</text>
    <line x1="477" y1="203" x2="923" y2="203" stroke="#334155"/>
    <g font-family="Arial,sans-serif" font-size="14" font-weight="700">
      <rect x="478" y="222" width="130" height="42" rx="12" fill="#1e293b"/><text x="543" y="248" fill="#6ee7b7" text-anchor="middle">CHARGE MOYENNE</text>
      <rect x="625" y="222" width="150" height="42" rx="12" fill="#1e293b"/><text x="700" y="248" fill="#7dd3fc" text-anchor="middle">ÉNERGIE TOTALE</text>
      <rect x="792" y="222" width="130" height="42" rx="12" fill="#1e293b"/><text x="857" y="248" fill="#fcd34d" text-anchor="middle">PUISSANCES</text>
    </g>
  </g>
</svg>
